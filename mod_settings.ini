[Mod]
Id=CombatCamera
Name=Combat Camera - Configurable
Author=my-mods
Version=3.4.3-dev
AuthorURL=https://www.nexusmods.com/profile/oOCamilleOo
Description=Choose free camera, smooth target tracking or native tracking. Use the target-lock button to enable targeting; Camera-directed targeting chooses automatic or fixed selection.

[Setting.enabled]
Id=enabled
Type=toggle
Label=Enable mod
Group=General
Description=Use configurable combat camera and targeting. With no lock selected, attacks follow the camera heading. Use the normal target-lock button to enable targeting.
PresetValues=0|1
PresetLabels=Off|On
Default=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=enabled

[Setting.crosshair]
Id=crosshair
Type=picker
Label=Center dot
Group=General
Description=Show a small center dot during gameplay. Menus and cinematics hide it.
PresetValues=0|1|2
PresetLabels=Off|Weapon drawn|Always in gameplay
Default=0
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=crosshair

[Setting.cameraMode]
Id=cameraMode
Type=picker
Label=Camera behavior
Group=Camera
Description=Free has no automatic enemy tracking. Smooth tracking gently follows a locked enemy, yields to mouse or right-stick movement, and resumes after an adjustable pause. Native tracking uses the game's normal tracking speed. Both targeting styles are supported.
PresetValues=0|1|2
PresetLabels=Free|Smooth tracking|Native tracking
Default=0
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=cameraMode

[Setting.trackingSpeed]
Id=trackingSpeed
Type=percent
Label=Tracking speed
Group=Camera
Description=Strength of smooth target following. Lower values turn more slowly. This adjusts automatic following, independently of controller aim slowdown.
Minimum=10
Maximum=100
Step=5
Decimals=0
Default=50
VisibleWhen=cameraMode
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=trackingSpeed

[Setting.trackingCatchup]
Id=trackingCatchup
Type=picker
Label=Tracking catch-up
Group=Camera
Description=Turn faster when the tracked enemy is far from your camera's aim, such as after teleporting behind you. The boost rises smoothly above 45 degrees and reaches the selected maximum at 180 degrees. Off keeps the normal tracking speed. Mouse and right-stick movement still take priority.
PresetValues=100|200|300|400|500
PresetLabels=Off|Up to 2x|Up to 3x|Up to 4x|Up to 5x
Default=300
VisibleWhen=cameraMode
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=trackingCatchup

[Setting.trackingResumeMs]
Id=trackingResumeMs
Type=integer
Label=Tracking resume delay (ms)
Group=Camera
Description=Pause after mouse or right-stick camera movement before smooth tracking resumes. With Camera-directed targeting On, keep this longer than Target switch delay and allow some extra time for target selection, or tracking can pull you away before the switch completes. 750 ms is 0.75 seconds.
Minimum=0
Maximum=3000
Step=50
Decimals=0
Default=750
VisibleWhen=cameraMode
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=trackingResumeMs

[Setting.targeting]
Id=targeting
Type=toggle
Label=Camera-directed targeting
Group=Targeting
Description=While target lock is active: On selects enemies toward the camera; Off keeps the selected enemy. Lock to last attacker takes priority after a hit when enabled. With target lock off, Automatic lock on hit can acquire the next attacker when enabled.
PresetValues=0|1
PresetLabels=Off|On
Default=1
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=targeting

[Setting.coneDegrees]
Id=coneDegrees
Type=integer
Label=Targeting cone
Group=Targeting
Description=Maximum angle from the camera axis, in degrees. Smaller values require more precise aim. Zero uses the native cone.
Minimum=0
Maximum=90
Step=1
Decimals=0
Default=45
VisibleWhen=targeting
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=coneDegrees

[Setting.delayMs]
Id=delayMs
Type=integer
Label=Target switch delay
Group=Targeting
Description=How long a different enemy must remain the preferred target before switching, in milliseconds. Zero switches immediately. With Smooth tracking, set Tracking resume delay longer than this and allow some extra time for target selection.
Minimum=0
Maximum=1000
Step=5
Decimals=0
Default=65
VisibleWhen=targeting
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=delayMs

[Setting.lockLastAttacker]
Id=lockLastAttacker
Type=toggle
Label=Lock to last attacker
Group=Targeting
Description=While already locked on, switch to the last enemy whose attack hits you, including blocks and parries. With Camera-directed targeting On, deliberately turn the camera toward another enemy and hold aim for Target switch delay to override this priority. Tiny camera inputs do not release the attacker. With it Off, keep the attacker until another hits you, you unlock, or the target is lost. Works with every camera behavior. Automatic lock on hit also enables attacker switching and can turn target lock on.
PresetValues=0|1
PresetLabels=Off|On
Default=0
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=lockLastAttacker

[Setting.autoLockOnHit]
Id=autoLockOnHit
Type=toggle
Label=Automatic lock on hit
Group=Targeting
Description=Lock onto an enemy when its attack hits you, including successful blocks and parries, even while unlocked. Later hits switch to the new attacker. With Camera-directed targeting On, deliberate camera aiming can choose another enemy; tiny inputs keep the attacker selected. Keeps your chosen camera behavior. Manual unlock cancels pending requests; a later hit can lock again.
PresetValues=0|1
PresetLabels=Off|On
Default=1
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=autoLockOnHit

[Setting.afterTargetDeath]
Id=afterTargetDeath
Type=picker
Label=After target death
Group=Targeting
Description=With Automatic lock on hit enabled, choose what happens when the locked enemy dies. Nearest enemy selects an eligible enemy in native targeting range, including behind you. If none qualifies, or with Wait for next hit, remain unlocked until another hit, block or parry. Temporary disappearance keeps its existing recovery.
PresetValues=0|1
PresetLabels=Nearest enemy|Wait for next hit
Default=0
VisibleWhen=autoLockOnHit
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=afterTargetDeath

[Setting.aimAssist]
Id=aimAssist
Type=toggle
Label=Controller aim slowdown
Group=Controller
Description=Gently slow the right stick near the selected enemy during camera-directed targeting. Fixed-target and untargeted modes keep full camera sensitivity. Mouse movement is unaffected.
PresetValues=0|1
PresetLabels=Off|On
Default=1
VisibleWhen=targeting
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=aimAssist

[Setting.assistStrength]
Id=assistStrength
Type=percent
Label=Slowdown strength
Group=Controller
Description=Maximum reduction in right-stick sensitivity when looking directly at the target. Fades out across a 10-degree cone.
Minimum=0
Maximum=80
Step=5
Decimals=0
Default=35
VisibleWhen=aimAssist
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=assistStrength

[Setting.debugLogging]
Id=debugLogging
Type=toggle
Label=Logging
Group=Diagnostics
Description=Write diagnostic events and aggregated operation counts and selection timings to ue4ss/UE4SS.log. Leave Off during normal play.
PresetValues=0|1
PresetLabels=Off|On
Default=0
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=debugLogging
