[Mod]
Id=CombatCamera
Name=Combat Camera - Configurable
Author=my-mods
Version=1.0.0
AuthorURL=https://www.nexusmods.com/profile/oOCamilleOo
Description=Free camera in every combat mode. Use the target-lock button to enable targeting; Camera-directed targeting chooses automatic or fixed selection.

[Setting.enabled]
Id=enabled
Type=toggle
Label=Enable mod
Group=General
Description=Keep the combat camera free. With no lock selected, attacks and directional blocks work without a selected enemy. Use the normal target-lock button to enable targeting.
PresetValues=0|1
PresetLabels=Off|On
Default=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=enabled

[Setting.targeting]
Id=targeting
Type=toggle
Label=Camera-directed targeting
Group=Targeting
Description=While target lock is active: On selects enemies toward the camera; Off keeps the selected enemy. Both leave the camera free. With target lock off, no enemies are selected.
PresetValues=0|1
PresetLabels=Off|On
Default=1
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=targeting

[Setting.delayMs]
Id=delayMs
Type=integer
Label=Target switch delay
Group=Targeting
Description=How long a different enemy must remain the preferred target before switching, in milliseconds. Zero switches immediately.
Minimum=0
Maximum=1000
Step=5
Decimals=0
Default=65
VisibleWhen=targeting
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=delayMs

[Setting.coneDegrees]
Id=coneDegrees
Type=integer
Label=Targeting cone
Group=Targeting
Description=Maximum angle from the camera axis, in degrees. Smaller values require more precise aim. Zero uses the native cone.
Minimum=0
Maximum=90
Step=1
Decimals=0
Default=45
VisibleWhen=targeting
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=coneDegrees

[Setting.crosshair]
Id=crosshair
Type=picker
Label=Center dot
Group=Crosshair
Description=Show a small center dot during gameplay. Menus and cinematics hide it.
PresetValues=0|1|2
PresetLabels=Off|Weapon drawn|Always in gameplay
Default=0
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=crosshair

[Setting.aimAssist]
Id=aimAssist
Type=toggle
Label=Controller aim slowdown
Group=Controller
Description=Gently slow the right stick near the selected enemy during camera-directed targeting. Fixed-target and untargeted modes keep full camera sensitivity. Mouse movement is unaffected.
PresetValues=0|1
PresetLabels=Off|On
Default=1
VisibleWhen=targeting
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=aimAssist

[Setting.assistStrength]
Id=assistStrength
Type=percent
Label=Slowdown strength
Group=Controller
Description=Maximum reduction in right-stick sensitivity when looking directly at the target. Fades out across a 10-degree cone.
Minimum=0
Maximum=80
Step=5
Decimals=0
Default=35
VisibleWhen=aimAssist
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=assistStrength

[Setting.debugLogging]
Id=debugLogging
Type=toggle
Label=Logging
Group=Diagnostics
Description=Write Apply events and aggregated operation counts and selection timings to ue4ss/UE4SS.log. Leave Off during normal play.
PresetValues=0|1
PresetLabels=Off|On
Default=0
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=debugLogging
