[Mod]
Id=CombatCamera
Name=Combat Camera - Configurable
Author=my-mods
Version=1.0.0
AuthorURL=https://www.nexusmods.com/profile/oOCamilleOo
Description=Free combat camera and camera-directed targeting. Apply saves your choices and updates gameplay immediately.

[Setting.enabled]
Id=enabled
Type=toggle
Label=Enable mod
Group=General
Description=Enable the selected camera, targeting, crosshair and controller assistance features.
PresetValues=0|1
PresetLabels=Off|On
Default=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=enabled

[Setting.freeCamera]
Id=freeCamera
Type=toggle
Label=Free combat camera
Group=Camera
Description=Keep control of the combat camera. Manual lock-on retains the normal locked camera.
PresetValues=0|1
PresetLabels=Off|On
Default=1
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=freeCamera

[Setting.targeting]
Id=targeting
Type=toggle
Label=Camera-directed targeting
Group=Targeting
Description=Prefer the enemy you are looking toward. Manual lock-on and committed combat actions keep priority.
PresetValues=0|1
PresetLabels=Off|On
Default=1
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=targeting

[Setting.delayMs]
Id=delayMs
Type=integer
Label=Target switch delay
Group=Targeting
Description=How long a different enemy must remain the preferred target before switching, in milliseconds. Zero switches immediately.
Minimum=0
Maximum=1000
Step=5
Decimals=0
Default=65
VisibleWhen=targeting
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=delayMs

[Setting.coneDegrees]
Id=coneDegrees
Type=integer
Label=Targeting cone
Group=Targeting
Description=Maximum angle from the camera axis, in degrees. Smaller values require more precise aim. Zero uses the native cone.
Minimum=0
Maximum=90
Step=1
Decimals=0
Default=45
VisibleWhen=targeting
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=coneDegrees

[Setting.crosshair]
Id=crosshair
Type=picker
Label=Center dot
Group=Crosshair
Description=Show a small center dot during gameplay. Menus and cinematics hide it.
PresetValues=0|1|2
PresetLabels=Off|Weapon drawn|Always in gameplay
Default=0
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=crosshair

[Setting.aimAssist]
Id=aimAssist
Type=toggle
Label=Controller aim slowdown
Group=Controller
Description=Gently slow the right stick near your current enemy target. Does not turn the camera automatically or affect mouse movement.
PresetValues=0|1
PresetLabels=Off|On
Default=1
VisibleWhen=enabled
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=aimAssist

[Setting.assistStrength]
Id=assistStrength
Type=percent
Label=Slowdown strength
Group=Controller
Description=Maximum reduction in right-stick sensitivity when looking directly at the target. Fades out across a 10-degree cone.
Minimum=0
Maximum=80
Step=5
Decimals=0
Default=35
VisibleWhen=aimAssist
VisibleValues=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=assistStrength

[Setting.debugLogging]
Id=debugLogging
Type=toggle
Label=Logging
Group=Diagnostics
Description=Write Apply events and aggregated operation counts and selection timings to ue4ss/UE4SS.log. Leave Off during normal play.
PresetValues=0|1
PresetLabels=Off|On
Default=0
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=debugLogging
